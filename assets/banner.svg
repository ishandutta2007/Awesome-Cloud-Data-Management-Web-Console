<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b142b" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -120; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 12s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .stream-line { stroke-dasharray: 8 12; animation: dashStream 4s linear infinite; }
    .floating-card-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .floating-card-2 { animation: pillFloat2 6s ease-in-out infinite 1s; }
    .floating-card-3 { animation: pillFloat1 5.5s ease-in-out infinite 0.5s; }
    .floating-card-4 { animation: pillFloat2 6.5s ease-in-out infinite 1.5s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" class="orb-1" />
  <circle cx="1020" cy="280" r="220" fill="url(#glowGrad2)" class="orb-2" />
  <circle cx="600" cy="380" r="160" fill="url(#glowGrad1)" opacity="0.25" />

  <!-- Geometric Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Data Stream Circuit Lines (Background) -->
  <g opacity="0.35">
    <path d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-line" />
    <path d="M 80 340 Q 400 390 750 330 T 1120 360" fill="none" stroke="#a855f7" stroke-width="1.5" class="stream-line" style="animation-duration: 5s;" />
    <path d="M 200 420 L 450 280 L 750 280 L 1000 420" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="140" cy="90" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="280" cy="330" r="2.5" fill="#c084fc" class="particle-2" />
  <circle cx="920" cy="100" r="3.5" fill="#818cf8" class="particle-3" />
  <circle cx="1060" cy="220" r="2" fill="#38bdf8" class="particle-1" />
  <circle cx="70" cy="250" r="2" fill="#34d399" class="particle-2" />
  <circle cx="1130" cy="140" r="2.5" fill="#f472b6" class="particle-3" />

  <!-- Decorative Modern Architecture Floating Cards (Background/Edges, Never Overlapping Title) -->
  <!-- Card Left Top: Database Nodes -->
  <g class="floating-card-1" opacity="0.88">
    <rect x="50" y="42" width="170" height="58" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="72" cy="71" r="10" fill="#0284c7" fill-opacity="0.3" />
    <path d="M68 67 C68 65 76 65 76 67 C76 69 68 69 68 67 Z M68 70 C68 72 76 72 76 70 M68 73 C68 75 76 75 76 73" stroke="#38bdf8" stroke-width="1.2" fill="none" />
    <text x="92" y="65" fill="#e2e8f0" font-size="11" font-weight="700" class="body-text">Multi-DB Engine</text>
    <text x="92" y="80" fill="#94a3b8" font-size="10" class="body-text">SQL • NoSQL • Lake</text>
  </g>

  <!-- Card Left Bottom: Cloud Consoles -->
  <g class="floating-card-2" opacity="0.88">
    <rect x="50" y="318" width="175" height="58" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="72" cy="347" r="10" fill="#4f46e5" fill-opacity="0.3" />
    <circle cx="72" cy="347" r="4" fill="#818cf8" />
    <text x="92" y="341" fill="#e2e8f0" font-size="11" font-weight="700" class="body-text">Cloud Management</text>
    <text x="92" y="356" fill="#94a3b8" font-size="10" class="body-text">AWS • GCP • Azure</text>
  </g>

  <!-- Card Right Top: DevSecOps GitOps -->
  <g class="floating-card-3" opacity="0.88">
    <rect x="980" y="42" width="170" height="58" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="1002" cy="71" r="10" fill="#9333ea" fill-opacity="0.3" />
    <path d="M998 71 L1002 67 L1006 71 L1002 75 Z" stroke="#c084fc" stroke-width="1.2" fill="none" />
    <text x="1022" y="65" fill="#e2e8f0" font-size="11" font-weight="700" class="body-text">Database CI/CD</text>
    <text x="1022" y="80" fill="#94a3b8" font-size="10" class="body-text">GitOps &amp; Governance</text>
  </g>

  <!-- Card Right Bottom: Real-Time BI & Analytics -->
  <g class="floating-card-4" opacity="0.88">
    <rect x="975" y="318" width="175" height="58" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="997" cy="347" r="10" fill="#059669" fill-opacity="0.3" />
    <path d="M993 352 L996 345 L1000 348 L1003 342" stroke="#34d399" stroke-width="1.4" fill="none" />
    <text x="1017" y="341" fill="#e2e8f0" font-size="11" font-weight="700" class="body-text">Visual SQL Labs</text>
    <text x="1017" y="356" fill="#94a3b8" font-size="10" class="body-text">Analytics &amp; Dashboards</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Guaranteed Unobscured) ================= -->

  <!-- Status / Pill Top Center -->
  <g>
    <rect x="475" y="46" width="250" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="493" cy="60" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="506" y="64" fill="#38bdf8" font-size="11" font-weight="600" class="body-text" letter-spacing="0.5">CURATED AWESOME REPOSITORY</text>
  </g>

  <!-- Main Hero Title -->
  <g text-anchor="middle">
    <!-- Drop Shadow / Ambient Glow behind text for high contrast -->
    <text x="600" y="146" fill="#38bdf8" font-size="44" class="title-text" opacity="0.25" filter="url(#glow)">Cloud Data Management</text>
    <text x="600" y="142" fill="#ffffff" font-size="44" class="title-text">
      Cloud Data Management
    </text>

    <!-- Subtitle Line 1: Gradient Colored Emphasis -->
    <text x="600" y="194" fill="url(#accentGrad)" font-size="34" class="title-text" filter="url(#softGlow)">
      Web Consoles &amp; Admin UIs
    </text>

    <!-- Tagline: Clear White/Gray Body Text -->
    <text x="600" y="240" fill="#94a3b8" font-size="15" class="body-text">
      The definitive index of SaaS Platforms, SQL Workspaces, Cloud Consoles &amp; Open-Source Self-Hosted DB Managers
    </text>
  </g>

  <!-- Center Feature Pills Bar -->
  <g transform="translate(240, 268)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="65" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text">☁️ Hyperscalers</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="135" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="212" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text">⚡ SaaS Platforms</text>

    <!-- Pill 3 -->
    <rect x="295" y="0" width="135" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="362" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text">🌟 100% Open Source</text>

    <!-- Pill 4 -->
    <rect x="445" y="0" width="135" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="512" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text">🛡️ DevSecOps &amp; CI/CD</text>

    <!-- Pill 5 -->
    <rect x="595" y="0" width="125" height="30" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="657" y="19" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text">📊 SQL Workspaces</text>
  </g>

  <!-- Bottom Interactive Metadata Bar -->
  <g transform="translate(370, 320)">
    <rect x="0" y="0" width="460" height="28" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="230" y="18" text-anchor="middle" fill="#64748b" font-size="11" class="body-text">
      PostgreSQL • MySQL • Snowflake • Databricks • MongoDB • Redis • ClickHouse • Kafka
    </text>
  </g>

</svg>