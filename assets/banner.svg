<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0b142b"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity=".4"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(30px,-20px);opacity:.6}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes radarScan{0%{transform:rotate(0deg)}}.orb-1{animation:pulseOrb 10s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 12s ease-in-out infinite reverse;transform-origin:1000px 300px}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 2s}.particle-3{animation:floatParticle 7s ease-in-out infinite 1s}.stream-line{stroke-dasharray:8 12;animation:dashStream 4s linear infinite}.floating-card-1{animation:pillFloat1 5s ease-in-out infinite}.floating-card-2{animation:pillFloat2 6s ease-in-out infinite 1s}.floating-card-3{animation:pillFloat1 5.5s ease-in-out infinite .5s}.floating-card-4{animation:pillFloat2 6.5s ease-in-out infinite 1.5s}.body-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.body-text{font-weight:500}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" class="orb-1"/><circle cx="1020" cy="280" r="220" fill="url(#glowGrad2)" class="orb-2"/><circle cx="600" cy="380" r="160" fill="url(#glowGrad1)" opacity=".25"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 60" class="stream-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 80 340 Q 400 390 750 330 T 1120 360" class="stream-line" style="animation-duration:5s"/><path fill="none" stroke="#818cf8" stroke-dasharray="4 6" stroke-width="1" d="M 200 420 L 450 280 L 750 280 L 1000 420" opacity=".4"/></g><circle cx="140" cy="90" r="3" fill="#38bdf8" class="particle-1"/><circle cx="280" cy="330" r="2.5" fill="#c084fc" class="particle-2"/><circle cx="920" cy="100" r="3.5" fill="#818cf8" class="particle-3"/><circle cx="1060" cy="220" r="2" fill="#38bdf8" class="particle-1"/><circle cx="70" cy="250" r="2" fill="#34d399" class="particle-2"/><circle cx="1130" cy="140" r="2.5" fill="#f472b6" class="particle-3"/><g class="floating-card-1" opacity=".88"><rect width="170" height="58" x="50" y="42" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1" rx="10"/><circle cx="72" cy="71" r="10" fill="#0284c7" fill-opacity=".3"/><path fill="none" stroke="#38bdf8" stroke-width="1.2" d="M68 67 C68 65 76 65 76 67 C76 69 68 69 68 67 Z M68 70 C68 72 76 72 76 70 M68 73 C68 75 76 75 76 73"/><text x="92" y="65" fill="#e2e8f0" class="body-text" font-size="11" font-weight="700">Multi-DB Engine</text><text x="92" y="80" fill="#94a3b8" class="body-text" font-size="10">SQL • NoSQL • Lake</text></g><g class="floating-card-2" opacity=".88"><rect width="175" height="58" x="50" y="318" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".35" stroke-width="1" rx="10"/><circle cx="72" cy="347" r="10" fill="#4f46e5" fill-opacity=".3"/><circle cx="72" cy="347" r="4" fill="#818cf8"/><text x="92" y="341" fill="#e2e8f0" class="body-text" font-size="11" font-weight="700">Cloud Management</text><text x="92" y="356" fill="#94a3b8" class="body-text" font-size="10">AWS • GCP • Azure</text></g><g class="floating-card-3" opacity=".88"><rect width="170" height="58" x="980" y="42" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".35" stroke-width="1" rx="10"/><circle cx="1002" cy="71" r="10" fill="#9333ea" fill-opacity=".3"/><path fill="none" stroke="#c084fc" stroke-width="1.2" d="M998 71 L1002 67 L1006 71 L1002 75 Z"/><text x="1022" y="65" fill="#e2e8f0" class="body-text" font-size="11" font-weight="700">Database CI/CD</text><text x="1022" y="80" fill="#94a3b8" class="body-text" font-size="10">GitOps &amp; Governance</text></g><g class="floating-card-4" opacity=".88"><rect width="175" height="58" x="975" y="318" fill