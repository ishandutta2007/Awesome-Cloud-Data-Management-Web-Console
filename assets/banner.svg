ms</text><rect width="135" height="30" x="295" y="0" fill="#1e293b" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="8"/><text x="362" y="19" fill="#e2e8f0" class="body-text" font-size="11" font-weight="600" text-anchor="middle">🌟 100% Open Source</text><rect width="135" height="30" x="445" y="0" fill="#1e293b" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="8"/><text x="512" y="19" fill="#e2e8f0" class="body-text" font-size="11" font-weight="600" text-anchor="middle">🛡️ DevSecOps &amp; CI/CD</text><rect width="125" height="30" x="595" y="0" fill="#1e293b" fill-opacity=".9" stroke="#334155" stroke-width="1" rx="8"/><text x="657" y="19" fill="#e2e8f0" class="body-text" font-size="11" font-weight="600" text-anchor="middle">📊 SQL Workspaces</text></g><g transform="translate(370, 320)"><rect width="460" height="28" x="0" y="0" fill="#0f172a" fill-opacity=".9" stroke="#1e293b" stroke-width="1" rx="6"/><text x="230" y="18" fill="#64748b" class="body-text" font-size="11" text-anchor="middle">PostgreSQL • MySQL • Snowflake • Databricks • MongoDB • Redis • ClickHouse • Kafka</text></g></svg>